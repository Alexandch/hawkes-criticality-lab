[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hawkes-criticality-lab"
version = "0.1.0"
description = "Hawkes Criticality Lab: Monte Carlo experiments, criticality estimation, and early-warning evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
neural = ["torch>=2.3"]
fast = ["numba>=0.63"]
expanded = ["torch>=2.3", "scikit-learn==1.9.1", "threadpoolctl>=3.5"]
report = ["reportlab>=4", "pypdf>=5"]

[project.scripts]
critical-processes = "critical_processes.cli:main"
hawkes-criticality = "critical_processes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
